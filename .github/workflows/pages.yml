# The demo, on GitHub Pages.
#
# demo/index.html imports ../src/panes.js and ../src/panes.css, so the
# site is those two directories and nothing else, laid out the way the
# repository lays them out -- the page published is the page a reader
# checks out, which is the point of having one demo rather than a
# built copy of it.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One at a time, and a run already going is left to finish: a half
# published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The page the site's address redirects to has the preview tags as
      # well: whatever unfurls a link reads the page it was given and does
      # not follow a meta refresh to find the demo's.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r src demo _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>mullion</title>
          <meta property="og:title" content="mullion · playground">
          <meta property="og:description" content="A tiling layout for a page you already have: splits, tabs and a drawer over an ordinary document, and work behind a tab that stops.">
          <meta property="og:url" content="https://mishan.github.io/mullion/">
          <meta property="og:image" content="https://mishan.github.io/mullion/demo/og.png">
          <meta name="twitter:card" content="summary_large_image">
          <meta http-equiv="refresh" content="0; url=demo/">
          </head>
          <body><p><a href="demo/">The demo</a>.</p></body>
          </html>
          HTML

      # No configure-pages step: it exists to hand a base path and an
      # origin to a site generator that has to bake them in, and this
      # site is files laid out the way the repository lays them out.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
