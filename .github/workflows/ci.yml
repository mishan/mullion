# The tests are a browser driving demo/index.html, which is the whole
# claim this module makes: that it adopts a document and puts it back. So
# there is one job, once per browser: Chromium moves a pane with
# `moveBefore' and keeps what it was doing, and the others are where the
# module has to keep it by hand.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: check (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The declarations are hand-written, so they are checked rather
      # than trusted.
      - run: npm run types

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - run: npm test -- ${{ matrix.browser }}
