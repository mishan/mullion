<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>mullion fixture</title>
<link rel="stylesheet" href="../../src/panes.css">
<link rel="stylesheet" href="fixture.css">
</head>
<body>

<!--
  A page that exists to be tiled, and what test/check.mjs drives. The
  demo people look at is demo/; this one is shaped by the tests.

  What mullion promises is about a document -- that it adopts one, puts
  it back, and keeps every id on the way -- and a claim about a document
  needs one with enough in it to be worth making: a <details> that folds, a <section> that does not, a canvas
  whose work is observable, a box that scrolls sideways, a text box a
  chord must not reach, and a popover that would be clipped by the pane
  it belongs beside.

  Open it in a browser wider than 60em. Drag a tab onto another pane to
  stack them, onto an edge to split, onto the row at the top to close it.
  Alt with an arrow moves the focus, Alt Shift moves the pane, Alt Enter
  zooms, Alt W closes, Alt 0 starts over.
-->

<div class="chrome">
  <h1>mullion</h1>
  <label>Mode <select id="mode">
    <option value="one">one</option>
    <option value="two">two</option>
  </select></label>
  <span id="say">ready</span>
</div>

<div id="root"></div>

<!-- A box that folds, with a text box in it: the fold is handed to the
     pane's own header, and a chord typed in here is text. -->
<details id="fx-doc" open data-pane data-pane-title="Doc" data-pane-min="280">
  <summary>A box that folds</summary>
  <textarea id="fx-text" spellcheck="false">type here</textarea>
</details>

<!-- Two canvases that draw only while somebody is looking, which is the
     whole of what onShow is for. Stacked as tabs, one of them stops. -->
<section id="fx-paint" data-pane data-pane-title="Paint" data-pane-min="240">
  <canvas id="fx-paint-c" width="320" height="200"></canvas>
</section>

<section id="fx-plot" data-pane data-pane-title="Plot" data-pane-min="240">
  <canvas id="fx-plot-c" width="320" height="200"></canvas>
</section>

<!-- Wider than any pane, so it scrolls sideways: what a popover placed
     against its right edge has to be held inside. -->
<section id="fx-wide" data-pane data-pane-title="Wide" data-pane-min="200">
  <div id="fx-scroll" class="scroller">
    <div class="far">
      <span>Scroll right, for a popover against the window's edge.</span>
      <button id="fx-pop">popover</button>
    </div>
  </div>
</section>

<section id="fx-list" data-pane data-pane-title="List" data-pane-min="180">
  <ul id="fx-items"><li>one</li><li>two</li><li>three</li></ul>
</section>

<details id="fx-notes" data-pane data-pane-title="Notes" data-pane-min="180">
  <summary>Folded to start with</summary>
  <p>Which the pane's header takes over.</p>
</details>

<!-- One per mode, so `available' and `mode' have something to switch. -->
<section id="fx-only-one" data-pane data-pane-title="Only one"
         data-pane-min="180">
  <p>Mode one has this.</p>
</section>

<section id="fx-only-two" data-pane data-pane-title="Only two"
         data-pane-min="180" data-pane-off>
  <p>Mode two has this.</p>
</section>

<div id="fx-menu" class="popover" hidden>A popover.</div>

<script type="module" src="fixture.js"></script>
</body>
</html>
